name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Motor JS + NLP
        run: node tests/selftest.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend
        run: |
          pip install -r requirements.txt pytest httpx
          python -m pytest -q
